name: Jekyll Build

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/check-jekyll-site.py'
      - '.github/workflows/jekyll-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby and install the GitHub Pages Jekyll bundle
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: docs
      - name: Build with Jekyll
        run: bundle exec jekyll build --source . --destination ../_site --trace
      - name: Check local links and four-language completeness
        working-directory: .
        run: python3 scripts/check-jekyll-site.py --built _site
      - name: Upload generated site for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jekyll-generated-site
          path: _site/
          if-no-files-found: ignore
