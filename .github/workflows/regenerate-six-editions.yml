name: Regenerate corrected six-language PDFs (temporary)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/regenerate-six-editions.yml'
      - 'manual*.tex'

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ github.event.pull_request.number == 4 && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - name: Build all editions in pinned TeX Live environment
        run: |
          make docker-image
          docker run --rm -u "$(id -u):$(id -g)" \
            -v "$PWD":/work -w /work at-the-last-throw-tex:tl2024 \
            make -B all
      - name: Verify typography and page counts
        run: |
          set -eu
          for edition in manual manual-it manual-fr manual-uk manual-de manual-es; do
            pdf="build/$edition.pdf"
            pages="$(pdfinfo "$pdf" | awk '/^Pages:/{print $2}')"
            test "$pages" -ge 13
            if grep -Eq 'Overfull|Underfull' "build/$edition.log"; then
              echo "::error::$edition has box warnings"
              grep -E '(Overfull|Underfull)' "build/$edition.log" | head
              exit 1
            fi
            echo "$edition: $pages pages, no box warnings"
          done
      - name: Replace downloadable PDFs
        run: |
          cp build/manual.pdf docs/downloads/rulebook-en.pdf
          cp build/manual-it.pdf docs/downloads/rulebook-it.pdf
          cp build/manual-fr.pdf docs/downloads/rulebook-fr.pdf
          cp build/manual-uk.pdf docs/downloads/rulebook-uk.pdf
          cp build/manual-de.pdf docs/downloads/rulebook-de.pdf
          cp build/manual-es.pdf docs/downloads/rulebook-es.pdf
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/downloads/rulebook-*.pdf
          if ! git diff --cached --quiet; then
            git commit -m 'Regenerate six rulebook downloads after rules clarifications'
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi
